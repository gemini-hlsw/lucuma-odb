receivers:
  otlp:
    protocols:
      http:
        endpoint: 127.0.0.1:4318

processors:
  memory_limiter:
    limit_mib: 400
    spike_limit_mib: 100
    check_interval: 5s
  # WebSocket handshake traces carry no useful data and failed ones flood Tempo.
  # Spans are filtered one by one, so the route's inner spans are listed too.
  filter/ws-handshake:
    error_mode: ignore
    traces:
      span:
        - 'attributes["url.path"] == "/ws"'
        - 'name == "GET /ws"'
        - 'name == "graphql.routes.webSocketConnection"'
  batch:
    timeout: 5s
    send_batch_size: 512

exporters:
  otlphttp/grafana:
    endpoint: "${env:GRAFANA_OTLP_ENDPOINT}"
    headers:
      authorization: "Basic ${env:GRAFANA_OTLP_TOKEN}"

service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, filter/ws-handshake, batch]
      exporters: [otlphttp/grafana]
    metrics:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [otlphttp/grafana]
