apiVersion: syntheticmonitoring.ext.grafana.app/v1alpha1
kind: Check
metadata:
  name: sso-dev-ready
spec:
  job: sso-dev-ready
  target: https://sso-dev.gpp.gemini.edu/health/ready
  frequency: 900000
  timeout: 10000
  enabled: true
  labels:
    - name: environment
      value: dev
    - name: system
      value: sso
    - name: kind
      value: readiness
  probes:
    - NorthVirginia
    - SaoPaulo
  basicMetricsOnly: true
  settings:
    http:
      method: GET
      validStatusCodes: [200]
      failIfBodyNotMatchesRegexp:
        - '"status":"ok"'
      ipVersion: V4
