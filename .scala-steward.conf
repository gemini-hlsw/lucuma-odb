# opentelemetry-java must stay on the version otel4s-oteljava is built against
# (otel4s 1.1.0 -> opentelemetry 1.64.0).
# Move this prefix by hand, together with otel4sVersion in build.sbt.
updates.pin = [
  { groupId = "io.opentelemetry", version = { prefix = "1.64." } }
]

# Keep the remaining otel artifacts in one PR so otel4s and the instrumentation
# line are reviewed and merged together, never one ahead of the other.
pullRequests.grouping = [
  {
    name   = "otel",
    title  = "OpenTelemetry updates",
    filter = [
      { group = "io.opentelemetry.instrumentation" },
      { artifact = "otel4s*" },
      { artifact = "http4s-otel4s*" }
    ]
  }
]
