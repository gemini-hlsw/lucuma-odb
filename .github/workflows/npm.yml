# Publishes the npm package containing the graphql schemas.
# Only runs on the main branch when one of the schemas is changed.

name: Publish npm package

on:
  push:
    branches:
      - "main"
    paths:
      - "**.graphql"
  workflow_dispatch:

permissions:
  id-token: write # Required for OIDC
  contents: read

concurrency:
  group: ${{ github.workflow }} @ ${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    name: Publish NPM package

    runs-on: ubuntu-latest
    steps:
      - name: Checkout current branch (full)
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup sbt
        uses: sbt/setup-sbt@v1

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 25
          # No `cache: sbt`: only ci.yml writes the sbt cache. This job would save a partial
          # one under the same key and leave CI downloading mid-test.

      - name: Restore sbt cache (read-only, written by ci.yml)
        uses: actions/cache/restore@v6
        with:
          # Must be byte-for-byte what setup-java passes for `cache: sbt` on Linux, in this
          # order: the cache "version" is a hash of this list, and a different list never matches.
          path: |
            /home/runner/.ivy2/cache
            /home/runner/.sbt
            /home/runner/.cache/coursier
            !/home/runner/.sbt/*.lock
            !/home/runner/**/ivydata-*.properties
          key: setup-java-${{ runner.os }}-x64-sbt-${{ hashFiles('**/*.sbt', '**/project/build.properties', '**/project/**.scala', '**/project/**.sbt', '.github/workflows/ci.yml') }}
          restore-keys: setup-java-${{ runner.os }}-x64-sbt-

      - uses: actions/setup-node@v7
        with:
          node-version: 26
          registry-url: "https://registry.npmjs.org"

      - name: NPM Publish
        run: sbt schemaJVM/npmPublish
