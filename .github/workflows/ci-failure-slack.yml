# Hand-written: sbt-typelevel only generates ci.yml and clean.yml. Kept identical to the copy in
# lucuma-apps.
#
# GitHub only emails the actor who triggered a run, and merges are pushed by mergify[bot], so a
# red `main` would otherwise go unnoticed. This watches the CI workflow instead of instrumenting
# every job, so jobs added later are covered without touching this file.
#
# Legacy ITC Tests is here for its nightly cron: a scheduled run notifies only whoever last edited
# the cron expression, which is the same blind spot.
name: CI Failure Notification

on:
  workflow_run:
    workflows: [Continuous Integration, Legacy ITC Tests]
    types: [completed]
    branches: [main]

permissions:
  actions: read
  contents: read

jobs:
  notify:
    name: Notify Slack
    if: github.event.workflow_run.conclusion == 'failure' || github.event.workflow_run.conclusion == 'timed_out'
    runs-on: ubuntu-22.04
    steps:
      - name: Collect failed jobs
        id: failed
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          jobs=$(gh api --paginate \
            "repos/${{ github.repository }}/actions/runs/${{ github.event.workflow_run.id }}/jobs" \
            -q '.jobs[] | select(.conclusion == "failure" or .conclusion == "timed_out") | .name' \
            | paste -sd ', ' -)
          echo "jobs=${jobs:-unknown}" >> "$GITHUB_OUTPUT"

      - name: Post to Slack
        env:
          GPP_SLACK_WEBHOOK_URL: ${{ secrets.GPP_SLACK_WEBHOOK_URL }}
          FAILED_JOBS: ${{ steps.failed.outputs.jobs }}
          RUN_URL: ${{ github.event.workflow_run.html_url }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          ACTOR: ${{ github.event.workflow_run.actor.login }}
          CONCLUSION: ${{ github.event.workflow_run.conclusion }}
        run: |
          set -euo pipefail
          text=$(printf ':x: *%s* CI %s on `main`\n*Failed:* %s\n*Commit:* `%s` (%s)\n%s' \
            "${{ github.repository }}" "$CONCLUSION" "$FAILED_JOBS" "${HEAD_SHA:0:8}" "$ACTOR" "$RUN_URL")
          jq -n --arg text "$text" '{text: $text}' \
            | curl -sS --fail-with-body -X POST -H 'Content-type: application/json' --data @- "$GPP_SLACK_WEBHOOK_URL"
