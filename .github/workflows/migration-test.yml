name: Test Migrations Against Heroku Backups

on:
  pull_request:
    paths:
      - "modules/service/src/main/resources/db/migration/**"
  workflow_dispatch:

env:
  HEROKU_API_KEY: ${{ secrets.HEROKU_API_KEY }}
  PG_HOST: localhost
  PG_USER: jimmy
  PG_DATABASE: lucuma-odb
  PGPASSWORD: banana

jobs:
  test-migrations:
    name: migration with db from ${{ matrix.environment }}
    runs-on: ubuntu-22.04
    timeout-minutes: 30

    strategy:
      fail-fast: false
      matrix:
        environment: [dev, staging, production]

    steps:
      - name: Checkout current branch
        uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: Setup Java (temurin@25)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
          # No `cache: sbt`: only ci.yml writes the sbt cache. This job would save a partial
          # one under the same key and leave CI downloading mid-test.

      - name: Restore sbt cache (read-only, written by ci.yml)
        uses: actions/cache/restore@v6
        with:
          # Must be byte-for-byte what setup-java passes for `cache: sbt` on Linux, in this
          # order: the cache "version" is a hash of this list, and a different list never matches.
          path: |
            /home/runner/.ivy2/cache
            /home/runner/.sbt
            /home/runner/.cache/coursier
            !/home/runner/.sbt/*.lock
            !/home/runner/**/ivydata-*.properties
          key: setup-java-${{ runner.os }}-x64-sbt-${{ hashFiles('**/*.sbt', '**/project/build.properties', '**/project/**.scala', '**/project/**.sbt', '.github/workflows/ci.yml') }}
          restore-keys: setup-java-${{ runner.os }}-x64-sbt-

      - name: Setup sbt
        uses: sbt/setup-sbt@v1

      - name: Cache pgsql
        id: cache-pg
        uses: actions/cache@v4
        with:
          path: /usr/lib/postgresql/15
          key: pg-client-15-jammy

      - name: Install PostgreSQL client tools
        if: steps.cache-pg.outputs.cache-hit != 'true'
        run: |
          sudo sh -c 'echo "deb http://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" > /etc/apt/sources.list.d/pgdg.list'
          wget --quiet -O - https://www.postgresql.org/media/keys/ACCC4CF8.asc | sudo apt-key add -
          sudo apt-get update
          sudo apt-get install -y postgresql-client-15

      - name: Add PostgreSQL to PATH
        run: echo "/usr/lib/postgresql/15/bin" >> $GITHUB_PATH

      - name: Cache Heroku CLI
        id: cache-heroku
        uses: actions/cache@v4
        with:
          path: /usr/local/lib/heroku
          key: heroku-cli-v1

      - name: Install Heroku CLI
        if: steps.cache-heroku.outputs.cache-hit != 'true'
        run: curl https://cli-assets.heroku.com/install.sh | sh

      - name: Add Heroku to PATH
        run: echo "/usr/local/lib/heroku/bin" >> $GITHUB_PATH

      - name: Set up cert permissions
        run: |
          chmod 600 test-cert/server.key
          sudo chown 999 test-cert/server.key

      - name: Run migration against ${{ matrix.environment }}
        timeout-minutes: 15
        run: ./populate-db-from-heroku.sh ${{ matrix.environment }} --test
