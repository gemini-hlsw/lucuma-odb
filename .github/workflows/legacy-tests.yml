name: Legacy ITC Tests

on:
  pull_request:
    paths:
      - "itc/service/ocslib/**"
      - "itc/legacy-tests/**"
      - "itc/service/src/main/scala/lucuma/itc/legacy/**"
  schedule:
    - cron: "0 2 * * *" # Daily at 2 AM UTC
  workflow_dispatch:

jobs:
  legacy-tests:
    name: ITC Legacy Tests (shard ${{ matrix.shard }})
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    strategy:
      # One shard failing should not cancel the others; we want the full picture.
      fail-fast: false
      matrix:
        java: [temurin@25]
        scala: [3]
        shard: [0, 1, 2, 3, 4, 5]
    steps:
      - name: Checkout code
        uses: nschloe/action-cached-lfs-checkout@v1
        with:
          fetch-depth: 1

      - name: Setup sbt
        uses: sbt/setup-sbt@v1

      - name: Setup Java (temurin@25)
        id: setup-java-temurin-25
        if: matrix.java == 'temurin@25'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
          # No `cache: sbt`: only ci.yml writes the sbt cache. This job would save a partial
          # one under the same key and leave CI downloading mid-test.

      - name: Restore sbt cache (read-only, written by ci.yml)
        if: matrix.java == 'temurin@25'
        uses: actions/cache/restore@v6
        with:
          # Must be byte-for-byte what setup-java passes for `cache: sbt` on Linux, in this
          # order: the cache "version" is a hash of this list, and a different list never matches.
          path: |
            /home/runner/.ivy2/cache
            /home/runner/.sbt
            /home/runner/.cache/coursier
            !/home/runner/.sbt/*.lock
            !/home/runner/**/ivydata-*.properties
          key: setup-java-${{ runner.os }}-x64-sbt-${{ hashFiles('**/*.sbt', '**/project/build.properties', '**/project/**.scala', '**/project/**.sbt', '.github/workflows/ci.yml') }}
          restore-keys: setup-java-${{ runner.os }}-x64-sbt-

      # Sharding is handled by sbt-test-shards (auto-enabled on every project), which reads
      # these two variables and filters the suites by name hash. Keep TEST_SHARD_COUNT in step
      # with the `shard` matrix above.
      - name: Run Legacy ITC Tests
        env:
          RUN_LEGACY_TESTS: true
          TEST_SHARD_COUNT: 6
          TEST_SHARD: ${{ matrix.shard }}
        run: sbt -v -J-Xmx6g itcLegacyTests/test
