name: Continuous Integration

on:
  pull_request:
    branches: ['**', '!update/**', '!pr/**']
  push:
    branches: ['**', '!update/**', '!pr/**']
    tags: [v*]

env:
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  HEROKU_API_KEY: ${{ secrets.HEROKU_API_KEY }}
  MUNIT_FLAKY_OK: ${{ vars.MUNIT_FLAKY_OK }}
  PYEXPLORE_TOKEN: ${{ secrets.PYEXPLORE_TOKEN }}


concurrency:
  group: ${{ github.workflow }} @ ${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Test
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04]
        scala: [3]
        java: [temurin@25]
        shard: [0, 1, 2, 3, 4, 5, 6, 7]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - name: Checkout current branch
        uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: Setup sbt
        uses: sbt/setup-sbt@v1

      - name: Setup Java (temurin@25)
        id: setup-java-temurin-25
        if: matrix.java == 'temurin@25'
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 25
          cache: sbt

      - name: sbt update
        if: matrix.java == 'temurin@25' && steps.setup-java-temurin-25.outputs.cache-hit == 'false'
        run: sbt -v -J-Xmx6g -J-Xss4M +update

      - name: Set up cert permissions (1)
        run: chmod 600 test-cert/server.key

      - name: Set up cert permissions (2)
        run: sudo chown 999 test-cert/server.key

      - name: Docker compose up
        run: docker compose up -d

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build lucuma-odb-test-db image
        uses: docker/build-push-action@v7
        with:
          cache-from: type=gha,scope=lucuma-odb-test-db
          tags: 'lucuma-odb-test-db:ci'
          context: modules/service/src
          load: true
          build-args: |
            POSTGRES_USER=test
            POSTGRES_PASSWORD=test
            POSTGRES_DB=test
          cache-to: ${{ matrix.shard == '0' && 'type=gha,scope=lucuma-odb-test-db,mode=max' || '' }}

      - name: Build lucuma-sso-test-db image
        uses: docker/build-push-action@v7
        with:
          cache-from: type=gha,scope=lucuma-sso-test-db
          tags: 'lucuma-sso-test-db:ci'
          context: modules/sso-service/src
          load: true
          build-args: |
            POSTGRES_USER=test
            POSTGRES_PASSWORD=test
            POSTGRES_DB=test
          cache-to: ${{ matrix.shard == '0' && 'type=gha,scope=lucuma-sso-test-db,mode=max' || '' }}

      - name: Build lucuma-resource-test-db image
        uses: docker/build-push-action@v7
        with:
          cache-from: type=gha,scope=lucuma-resource-test-db
          tags: 'lucuma-resource-test-db:ci'
          context: resource/service/src
          load: true
          build-args: |
            POSTGRES_USER=test
            POSTGRES_PASSWORD=test
            POSTGRES_DB=test
          cache-to: ${{ matrix.shard == '0' && 'type=gha,scope=lucuma-resource-test-db,mode=max' || '' }}

      - name: Test affected projects
        env:
          TEST_SHARD: ${{ matrix.shard }}
          ODB_TEST_DB_IMAGE: 'lucuma-odb-test-db:ci'
          TEST_SHARD_COUNT: 8
          SSO_TEST_DB_IMAGE: 'lucuma-sso-test-db:ci'
          RESOURCE_TEST_DB_IMAGE: 'lucuma-resource-test-db:ci'
        run: sbt -v -J-Xmx6g -J-Xss4M '++ ${{ matrix.scala }}' lucumaTestAffected

      - name: Docker compose down
        run: docker compose down

      - name: Make target directories
        if: github.event_name != 'pull_request' && (startsWith(github.ref, 'refs/tags/v'))
        run: mkdir -p itc/testkit/.jvm/target itc/service/target modules/binding/target itc/model/.jvm/target modules/otel/target modules/sso-frontend-client/.jvm/target itc/testkit/.js/target itc/model/.js/target itc/client/jvm/target modules/schema/.js/target target modules/common-middleware/target itc/client/js/target modules/schema/.jvm/target modules/sso-frontend-client/.js/target modules/sso-backend-client/target project/target

      - name: Compress target directories
        if: github.event_name != 'pull_request' && (startsWith(github.ref, 'refs/tags/v'))
        run: tar cf targets.tar itc/testkit/.jvm/target itc/service/target modules/binding/target itc/model/.jvm/target modules/otel/target modules/sso-frontend-client/.jvm/target itc/testkit/.js/target itc/model/.js/target itc/client/jvm/target modules/schema/.js/target target modules/common-middleware/target itc/client/js/target modules/schema/.jvm/target modules/sso-frontend-client/.js/target modules/sso-backend-client/target project/target

      - name: Upload target directories
        if: github.event_name != 'pull_request' && (startsWith(github.ref, 'refs/tags/v'))
        uses: actions/upload-artifact@v5
        with:
          name: target-${{ matrix.os }}-${{ matrix.java }}-${{ matrix.scala }}-${{ matrix.shard }}
          path: targets.tar

  publish:
    name: Publish Artifacts
    needs: [build]
    if: github.event_name != 'pull_request' && (startsWith(github.ref, 'refs/tags/v'))
    strategy:
      matrix:
        os: [ubuntu-22.04]
        java: [temurin@25]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout current branch
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup sbt
        uses: sbt/setup-sbt@v1

      - name: Setup Java (temurin@25)
        id: setup-java-temurin-25
        if: matrix.java == 'temurin@25'
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 25
          cache: sbt

      - name: sbt update
        if: matrix.java == 'temurin@25' && steps.setup-java-temurin-25.outputs.cache-hit == 'false'
        run: sbt -v -J-Xmx6g -J-Xss4M +update

      - name: Download target directories (3, 0)
        uses: actions/download-artifact@v6
        with:
          name: target-${{ matrix.os }}-${{ matrix.java }}-3-0

      - name: Inflate target directories (3, 0)
        run: |
          tar xf targets.tar
          rm targets.tar

      - name: Import signing key
        if: env.PGP_SECRET != '' && env.PGP_PASSPHRASE == ''
        env:
          PGP_SECRET: ${{ secrets.PGP_SECRET }}
          PGP_PASSPHRASE: ${{ secrets.PGP_PASSPHRASE }}
        run: echo $PGP_SECRET | base64 -d -i - | gpg --import

      - name: Import signing key and strip passphrase
        if: env.PGP_SECRET != '' && env.PGP_PASSPHRASE != ''
        env:
          PGP_SECRET: ${{ secrets.PGP_SECRET }}
          PGP_PASSPHRASE: ${{ secrets.PGP_PASSPHRASE }}
        run: |
          echo "$PGP_SECRET" | base64 -d -i - > /tmp/signing-key.gpg
          echo "$PGP_PASSPHRASE" | gpg --pinentry-mode loopback --passphrase-fd 0 --import /tmp/signing-key.gpg
          (echo "$PGP_PASSPHRASE"; echo; echo) | gpg --command-fd 0 --pinentry-mode loopback --change-passphrase $(gpg --list-secret-keys --with-colons 2> /dev/null | grep '^sec:' | cut --delimiter ':' --fields 5 | tail -n 1)

      - name: Publish
        env:
          SONATYPE_USERNAME: ${{ secrets.SONATYPE_USERNAME }}
          SONATYPE_PASSWORD: ${{ secrets.SONATYPE_PASSWORD }}
          SONATYPE_CREDENTIAL_HOST: ${{ secrets.SONATYPE_CREDENTIAL_HOST }}
        run: sbt -v -J-Xmx6g -J-Xss4M tlCiRelease

  validate-steward:
    name: Validate Steward Config
    strategy:
      matrix:
        os: [ubuntu-22.04]
        java: [temurin@17]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout current branch (fast)
        uses: actions/checkout@v6

      - name: Setup Java (temurin@17)
        id: setup-java-temurin-17
        if: matrix.java == 'temurin@17'
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - uses: coursier/setup-action@v1
        with:
          apps: scala-steward

      - run: scala-steward validate-repo-config .scala-steward.conf

  checks:
    name: Static checks and schema validation
    strategy:
      matrix:
        os: [ubuntu-22.04]
        scala: [3.9.0]
        java: [temurin@25]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout current branch
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup sbt
        uses: sbt/setup-sbt@v1

      - name: Setup Java (temurin@25)
        id: setup-java-temurin-25
        if: matrix.java == 'temurin@25'
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 25
          cache: sbt

      - name: sbt update
        if: matrix.java == 'temurin@25' && steps.setup-java-temurin-25.outputs.cache-hit == 'false'
        run: sbt -v -J-Xmx6g -J-Xss4M +update

      - name: Static checks
        run: sbt -v -J-Xmx6g -J-Xss4M '++ ${{ matrix.scala }}' githubWorkflowCheck headerCheckAll scalafmtCheckAll 'project /' scalafmtSbtCheck lucumaScalafmtCheck lucumaScalafixCheck lucumaSlackNotifyCheck 'scalafixAll --check' mimaReportBinaryIssues doc

      - name: Install npm dependencies
        if: github.event_name == 'pull_request'
        run: npm ci

      - name: Validate ODB GraphQL schema changes
        if: github.event_name == 'pull_request'
        run: node .github/validate-schema.mjs modules/schema/src/main/resources/lucuma/odb/graphql/OdbSchema.graphql

      - name: Validate ITC GraphQL schema changes
        if: github.event_name == 'pull_request'
        run: node .github/validate-schema.mjs itc/service/src/main/resources/graphql/itc.graphql

      - name: Validate Resource GraphQL schema changes
        if: github.event_name == 'pull_request'
        run: node .github/validate-schema.mjs resource/service/src/main/resources/graphql/resource.graphql

  deploy:
    name: Build and publish Docker images / Deploy to Heroku
    needs: [affected]
    if: (github.ref == 'refs/heads/main' && startsWith(github.repository, 'gemini'))
    strategy:
      matrix:
        os: [ubuntu-22.04]
        scala: [3.9.0]
        java: [temurin@25]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout current branch
        uses: nschloe/action-cached-lfs-checkout@v1
        with:
          fetch-depth: 0

      - name: Setup sbt
        uses: sbt/setup-sbt@v1

      - name: Setup Java (temurin@25)
        id: setup-java-temurin-25
        if: matrix.java == 'temurin@25'
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 25
          cache: sbt

      - name: sbt update
        if: matrix.java == 'temurin@25' && steps.setup-java-temurin-25.outputs.cache-hit == 'false'
        run: sbt -v -J-Xmx6g -J-Xss4M +update

      - name: Clean
        if: (contains(fromJSON(needs.affected.outputs.projects), 'ssoService') || contains(fromJSON(needs.affected.outputs.projects), 'itcService') || contains(fromJSON(needs.affected.outputs.projects), 'service') || contains(fromJSON(needs.affected.outputs.projects), 'obscalc') || contains(fromJSON(needs.affected.outputs.projects), 'calibrations') || contains(fromJSON(needs.affected.outputs.projects), 'pdfSummary') || contains(fromJSON(needs.affected.outputs.projects), 'resourceService'))
        run: sbt -v -J-Xmx6g -J-Xss4M '++ ${{ matrix.scala }}' clean

      - name: Build SSO Docker images
        if: (contains(fromJSON(needs.affected.outputs.projects), 'ssoService'))
        run: 'sbt -v -J-Xmx6g -J-Xss4M ''++ ${{ matrix.scala }}'' ssoService/docker:publishLocal'

      - name: Build ITC Docker images
        if: (contains(fromJSON(needs.affected.outputs.projects), 'itcService'))
        run: 'sbt -v -J-Xmx6g -J-Xss4M ''++ ${{ matrix.scala }}'' itcService/docker:publishLocal'

      - name: Build ODB Docker images
        if: (contains(fromJSON(needs.affected.outputs.projects), 'service') || contains(fromJSON(needs.affected.outputs.projects), 'obscalc') || contains(fromJSON(needs.affected.outputs.projects), 'calibrations') || contains(fromJSON(needs.affected.outputs.projects), 'pdfSummary'))
        run: 'sbt -v -J-Xmx6g -J-Xss4M ''++ ${{ matrix.scala }}'' service/docker:publishLocal obscalc/docker:publishLocal calibrations/docker:publishLocal pdfSummary/docker:publishLocal'

      - name: Build RESOURCE Docker images
        if: (contains(fromJSON(needs.affected.outputs.projects), 'resourceService'))
        run: 'sbt -v -J-Xmx6g -J-Xss4M ''++ ${{ matrix.scala }}'' resourceService/docker:publishLocal'

      - name: Log in to Heroku
        if: (contains(fromJSON(needs.affected.outputs.projects), 'ssoService') || contains(fromJSON(needs.affected.outputs.projects), 'itcService') || contains(fromJSON(needs.affected.outputs.projects), 'service') || contains(fromJSON(needs.affected.outputs.projects), 'obscalc') || contains(fromJSON(needs.affected.outputs.projects), 'calibrations') || contains(fromJSON(needs.affected.outputs.projects), 'pdfSummary') || contains(fromJSON(needs.affected.outputs.projects), 'resourceService'))
        run: |
          npm install -g heroku
          heroku container:login

      - name: Push SSO Docker images to Heroku
        if: (contains(fromJSON(needs.affected.outputs.projects), 'ssoService'))
        run: |
          docker tag noirlab/lucuma-sso-service registry.heroku.com/${{ vars.HEROKU_SSO_APP_NAME || 'lucuma-sso' }}-dev/web:${{ github.sha }}
          docker push registry.heroku.com/${{ vars.HEROKU_SSO_APP_NAME || 'lucuma-sso' }}-dev/web:${{ github.sha }}
          docker tag noirlab/lucuma-sso-service registry.heroku.com/${{ vars.HEROKU_SSO_APP_NAME || 'lucuma-sso' }}-staging/web:${{ github.sha }}
          docker push registry.heroku.com/${{ vars.HEROKU_SSO_APP_NAME || 'lucuma-sso' }}-staging/web:${{ github.sha }}
          docker tag noirlab/lucuma-sso-service registry.heroku.com/${{ vars.HEROKU_SSO_APP_NAME || 'lucuma-sso' }}-production/web:${{ github.sha }}
          docker push registry.heroku.com/${{ vars.HEROKU_SSO_APP_NAME || 'lucuma-sso' }}-production/web:${{ github.sha }}
          docker tag noirlab/lucuma-sso-service registry.heroku.com/${{ vars.HEROKU_SSO_APP_NAME || 'lucuma-sso' }}-dev/web
          docker push registry.heroku.com/${{ vars.HEROKU_SSO_APP_NAME || 'lucuma-sso' }}-dev/web

      - name: Push ITC Docker images to Heroku
        if: (contains(fromJSON(needs.affected.outputs.projects), 'itcService'))
        run: |
          docker tag noirlab/lucuma-itc-service registry.heroku.com/${{ vars.HEROKU_ITC_APP_NAME || 'itc' }}-dev/web:${{ github.sha }}
          docker push registry.heroku.com/${{ vars.HEROKU_ITC_APP_NAME || 'itc' }}-dev/web:${{ github.sha }}
          docker tag noirlab/lucuma-itc-service registry.heroku.com/${{ vars.HEROKU_ITC_APP_NAME || 'itc' }}-staging/web:${{ github.sha }}
          docker push registry.heroku.com/${{ vars.HEROKU_ITC_APP_NAME || 'itc' }}-staging/web:${{ github.sha }}
          docker tag noirlab/lucuma-itc-service registry.heroku.com/${{ vars.HEROKU_ITC_APP_NAME || 'itc' }}-production/web:${{ github.sha }}
          docker push registry.heroku.com/${{ vars.HEROKU_ITC_APP_NAME || 'itc' }}-production/web:${{ github.sha }}
          docker tag noirlab/lucuma-itc-service registry.heroku.com/${{ vars.HEROKU_ITC_APP_NAME || 'itc' }}-dev/web
          docker push registry.heroku.com/${{ vars.HEROKU_ITC_APP_NAME || 'itc' }}-dev/web

      - name: Push ODB Docker images to Heroku
        if: (contains(fromJSON(needs.affected.outputs.projects), 'service') || contains(fromJSON(needs.affected.outputs.projects), 'obscalc') || contains(fromJSON(needs.affected.outputs.projects), 'calibrations') || contains(fromJSON(needs.affected.outputs.projects), 'pdfSummary'))
        run: |
          docker tag noirlab/lucuma-odb-service registry.heroku.com/${{ vars.HEROKU_ODB_APP_NAME || 'lucuma-postgres-odb' }}-dev/web:${{ github.sha }}
          docker push registry.heroku.com/${{ vars.HEROKU_ODB_APP_NAME || 'lucuma-postgres-odb' }}-dev/web:${{ github.sha }}
          docker tag noirlab/lucuma-odb-service registry.heroku.com/${{ vars.HEROKU_ODB_APP_NAME || 'lucuma-postgres-odb' }}-staging/web:${{ github.sha }}
          docker push registry.heroku.com/${{ vars.HEROKU_ODB_APP_NAME || 'lucuma-postgres-odb' }}-staging/web:${{ github.sha }}
          docker tag noirlab/lucuma-odb-service registry.heroku.com/${{ vars.HEROKU_ODB_APP_NAME || 'lucuma-postgres-odb' }}-production/web:${{ github.sha }}
          docker push registry.heroku.com/${{ vars.HEROKU_ODB_APP_NAME || 'lucuma-postgres-odb' }}-production/web:${{ github.sha }}
          docker tag noirlab/lucuma-odb-service registry.heroku.com/${{ vars.HEROKU_ODB_APP_NAME || 'lucuma-postgres-odb' }}-dev/web
          docker push registry.heroku.com/${{ vars.HEROKU_ODB_APP_NAME || 'lucuma-postgres-odb' }}-dev/web
          docker tag noirlab/obscalc-service registry.heroku.com/${{ vars.HEROKU_ODB_APP_NAME || 'lucuma-postgres-odb' }}-dev/obscalc:${{ github.sha }}
          docker push registry.heroku.com/${{ vars.HEROKU_ODB_APP_NAME || 'lucuma-postgres-odb' }}-dev/obscalc:${{ github.sha }}
          docker tag noirlab/obscalc-service registry.heroku.com/${{ vars.HEROKU_ODB_APP_NAME || 'lucuma-postgres-odb' }}-staging/obscalc:${{ github.sha }}
          docker push registry.heroku.com/${{ vars.HEROKU_ODB_APP_NAME || 'lucuma-postgres-odb' }}-staging/obscalc:${{ github.sha }}
          docker tag noirlab/obscalc-service registry.heroku.com/${{ vars.HEROKU_ODB_APP_NAME || 'lucuma-postgres-odb' }}-production/obscalc:${{ github.sha }}
          docker push registry.heroku.com/${{ vars.HEROKU_ODB_APP_NAME || 'lucuma-postgres-odb' }}-production/obscalc:${{ github.sha }}
          docker tag noirlab/obscalc-service registry.heroku.com/${{ vars.HEROKU_ODB_APP_NAME || 'lucuma-postgres-odb' }}-dev/obscalc
          docker push registry.heroku.com/${{ vars.HEROKU_ODB_APP_NAME || 'lucuma-postgres-odb' }}-dev/obscalc
          docker tag noirlab/calibrations-service registry.heroku.com/${{ vars.HEROKU_ODB_APP_NAME || 'lucuma-postgres-odb' }}-dev/calibration:${{ github.sha }}
          docker push registry.heroku.com/${{ vars.HEROKU_ODB_APP_NAME || 'lucuma-postgres-odb' }}-dev/calibration:${{ github.sha }}
          docker tag noirlab/calibrations-service registry.heroku.com/${{ vars.HEROKU_ODB_APP_NAME || 'lucuma-postgres-odb' }}-staging/calibration:${{ github.sha }}
          docker push registry.heroku.com/${{ vars.HEROKU_ODB_APP_NAME || 'lucuma-postgres-odb' }}-staging/calibration:${{ github.sha }}
          docker tag noirlab/calibrations-service registry.heroku.com/${{ vars.HEROKU_ODB_APP_NAME || 'lucuma-postgres-odb' }}-production/calibration:${{ github.sha }}
          docker push registry.heroku.com/${{ vars.HEROKU_ODB_APP_NAME || 'lucuma-postgres-odb' }}-production/calibration:${{ github.sha }}
          docker tag noirlab/calibrations-service registry.heroku.com/${{ vars.HEROKU_ODB_APP_NAME || 'lucuma-postgres-odb' }}-dev/calibration
          docker push registry.heroku.com/${{ vars.HEROKU_ODB_APP_NAME || 'lucuma-postgres-odb' }}-dev/calibration
          docker tag noirlab/pdf-summary-service registry.heroku.com/${{ vars.HEROKU_ODB_APP_NAME || 'lucuma-postgres-odb' }}-dev/pdfsummary:${{ github.sha }}
          docker push registry.heroku.com/${{ vars.HEROKU_ODB_APP_NAME || 'lucuma-postgres-odb' }}-dev/pdfsummary:${{ github.sha }}
          docker tag noirlab/pdf-summary-service registry.heroku.com/${{ vars.HEROKU_ODB_APP_NAME || 'lucuma-postgres-odb' }}-staging/pdfsummary:${{ github.sha }}
          docker push registry.heroku.com/${{ vars.HEROKU_ODB_APP_NAME || 'lucuma-postgres-odb' }}-staging/pdfsummary:${{ github.sha }}
          docker tag noirlab/pdf-summary-service registry.heroku.com/${{ vars.HEROKU_ODB_APP_NAME || 'lucuma-postgres-odb' }}-production/pdfsummary:${{ github.sha }}
          docker push registry.heroku.com/${{ vars.HEROKU_ODB_APP_NAME || 'lucuma-postgres-odb' }}-production/pdfsummary:${{ github.sha }}
          docker tag noirlab/pdf-summary-service registry.heroku.com/${{ vars.HEROKU_ODB_APP_NAME || 'lucuma-postgres-odb' }}-dev/pdfsummary
          docker push registry.heroku.com/${{ vars.HEROKU_ODB_APP_NAME || 'lucuma-postgres-odb' }}-dev/pdfsummary

      - name: Push RESOURCE Docker images to Heroku
        if: (contains(fromJSON(needs.affected.outputs.projects), 'resourceService'))
        run: |
          docker tag noirlab/lucuma-resource-service registry.heroku.com/${{ vars.HEROKU_RESOURCE_APP_NAME || 'lucuma-resource' }}-dev/web:${{ github.sha }}
          docker push registry.heroku.com/${{ vars.HEROKU_RESOURCE_APP_NAME || 'lucuma-resource' }}-dev/web:${{ github.sha }}
          docker tag noirlab/lucuma-resource-service registry.heroku.com/${{ vars.HEROKU_RESOURCE_APP_NAME || 'lucuma-resource' }}-staging/web:${{ github.sha }}
          docker push registry.heroku.com/${{ vars.HEROKU_RESOURCE_APP_NAME || 'lucuma-resource' }}-staging/web:${{ github.sha }}
          docker tag noirlab/lucuma-resource-service registry.heroku.com/${{ vars.HEROKU_RESOURCE_APP_NAME || 'lucuma-resource' }}-production/web:${{ github.sha }}
          docker push registry.heroku.com/${{ vars.HEROKU_RESOURCE_APP_NAME || 'lucuma-resource' }}-production/web:${{ github.sha }}
          docker tag noirlab/lucuma-resource-service registry.heroku.com/${{ vars.HEROKU_RESOURCE_APP_NAME || 'lucuma-resource' }}-dev/web
          docker push registry.heroku.com/${{ vars.HEROKU_RESOURCE_APP_NAME || 'lucuma-resource' }}-dev/web

      - name: Release dev SSO app in Heroku
        if: (contains(fromJSON(needs.affected.outputs.projects), 'ssoService'))
        run: 'heroku container:release web -a ${{ vars.HEROKU_SSO_APP_NAME || ''lucuma-sso'' }}-dev -v'

      - name: Release dev ITC app in Heroku
        if: (contains(fromJSON(needs.affected.outputs.projects), 'itcService'))
        run: 'heroku container:release web -a ${{ vars.HEROKU_ITC_APP_NAME || ''itc'' }}-dev -v'

      - name: Release dev ODB app in Heroku
        if: (contains(fromJSON(needs.affected.outputs.projects), 'service') || contains(fromJSON(needs.affected.outputs.projects), 'obscalc') || contains(fromJSON(needs.affected.outputs.projects), 'calibrations') || contains(fromJSON(needs.affected.outputs.projects), 'pdfSummary'))
        run: 'heroku container:release web obscalc calibration pdfsummary -a ${{ vars.HEROKU_ODB_APP_NAME || ''lucuma-postgres-odb'' }}-dev -v'

      - name: Release dev RESOURCE app in Heroku
        if: (contains(fromJSON(needs.affected.outputs.projects), 'resourceService'))
        run: 'heroku container:release web -a ${{ vars.HEROKU_RESOURCE_APP_NAME || ''lucuma-resource'' }}-dev -v'

      - name: Get SSO Docker image SHA
        if: (contains(fromJSON(needs.affected.outputs.projects), 'ssoService'))
        run: |
          sha=$(docker inspect registry.heroku.com/${{ vars.HEROKU_SSO_APP_NAME || 'lucuma-sso' }}-dev/web:${{ github.sha }} --format={{.Id}})
          [ -n "$sha" ] || { echo "::error::no docker image for SSO/web"; exit 1; }
          echo "DOCKER_IMAGE_SHA_SSO_WEB=$sha" >> $GITHUB_ENV
          echo "SSO/web -> $sha"

      - name: Carry forward SSO Docker image SHA
        if: '!(contains(fromJSON(needs.affected.outputs.projects), ''ssoService''))'
        run: |
          prev=$(curl -s --fail-with-body -H "Authorization: Bearer $GITHUB_TOKEN" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/${{ github.repository }}/deployments?environment=development&task=deploy:SSO&per_page=1" | jq -c '.[0].payload.docker_image_shas // empty')
          [ -n "$prev" ] || { echo "::error::no previous SSO deployment to carry forward"; exit 1; }
          sha=$(printf '%s' "$prev" | jq -r --arg p "web" '.[$p] // empty')
          [ -n "$sha" ] || { echo "::error::previous SSO deployment has no image for web"; exit 1; }
          echo "DOCKER_IMAGE_SHA_SSO_WEB=$sha" >> $GITHUB_ENV
          echo "SSO/web -> $sha (carried forward)"

      - name: Get ITC Docker image SHA
        if: (contains(fromJSON(needs.affected.outputs.projects), 'itcService'))
        run: |
          sha=$(docker inspect registry.heroku.com/${{ vars.HEROKU_ITC_APP_NAME || 'itc' }}-dev/web:${{ github.sha }} --format={{.Id}})
          [ -n "$sha" ] || { echo "::error::no docker image for ITC/web"; exit 1; }
          echo "DOCKER_IMAGE_SHA_ITC_WEB=$sha" >> $GITHUB_ENV
          echo "ITC/web -> $sha"

      - name: Carry forward ITC Docker image SHA
        if: '!(contains(fromJSON(needs.affected.outputs.projects), ''itcService''))'
        run: |
          prev=$(curl -s --fail-with-body -H "Authorization: Bearer $GITHUB_TOKEN" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/${{ github.repository }}/deployments?environment=development&task=deploy:ITC&per_page=1" | jq -c '.[0].payload.docker_image_shas // empty')
          [ -n "$prev" ] || { echo "::error::no previous ITC deployment to carry forward"; exit 1; }
          sha=$(printf '%s' "$prev" | jq -r --arg p "web" '.[$p] // empty')
          [ -n "$sha" ] || { echo "::error::previous ITC deployment has no image for web"; exit 1; }
          echo "DOCKER_IMAGE_SHA_ITC_WEB=$sha" >> $GITHUB_ENV
          echo "ITC/web -> $sha (carried forward)"

      - name: Get ODB Docker image SHA
        if: (contains(fromJSON(needs.affected.outputs.projects), 'service') || contains(fromJSON(needs.affected.outputs.projects), 'obscalc') || contains(fromJSON(needs.affected.outputs.projects), 'calibrations') || contains(fromJSON(needs.affected.outputs.projects), 'pdfSummary'))
        run: |
          sha=$(docker inspect registry.heroku.com/${{ vars.HEROKU_ODB_APP_NAME || 'lucuma-postgres-odb' }}-dev/web:${{ github.sha }} --format={{.Id}})
          [ -n "$sha" ] || { echo "::error::no docker image for ODB/web"; exit 1; }
          echo "DOCKER_IMAGE_SHA_ODB_WEB=$sha" >> $GITHUB_ENV
          echo "ODB/web -> $sha"
          sha=$(docker inspect registry.heroku.com/${{ vars.HEROKU_ODB_APP_NAME || 'lucuma-postgres-odb' }}-dev/obscalc:${{ github.sha }} --format={{.Id}})
          [ -n "$sha" ] || { echo "::error::no docker image for ODB/obscalc"; exit 1; }
          echo "DOCKER_IMAGE_SHA_ODB_OBSCALC=$sha" >> $GITHUB_ENV
          echo "ODB/obscalc -> $sha"
          sha=$(docker inspect registry.heroku.com/${{ vars.HEROKU_ODB_APP_NAME || 'lucuma-postgres-odb' }}-dev/calibration:${{ github.sha }} --format={{.Id}})
          [ -n "$sha" ] || { echo "::error::no docker image for ODB/calibration"; exit 1; }
          echo "DOCKER_IMAGE_SHA_ODB_CALIBRATION=$sha" >> $GITHUB_ENV
          echo "ODB/calibration -> $sha"
          sha=$(docker inspect registry.heroku.com/${{ vars.HEROKU_ODB_APP_NAME || 'lucuma-postgres-odb' }}-dev/pdfsummary:${{ github.sha }} --format={{.Id}})
          [ -n "$sha" ] || { echo "::error::no docker image for ODB/pdfsummary"; exit 1; }
          echo "DOCKER_IMAGE_SHA_ODB_PDFSUMMARY=$sha" >> $GITHUB_ENV
          echo "ODB/pdfsummary -> $sha"

      - name: Carry forward ODB Docker image SHA
        if: '!(contains(fromJSON(needs.affected.outputs.projects), ''service'') || contains(fromJSON(needs.affected.outputs.projects), ''obscalc'') || contains(fromJSON(needs.affected.outputs.projects), ''calibrations'') || contains(fromJSON(needs.affected.outputs.projects), ''pdfSummary''))'
        run: |
          prev=$(curl -s --fail-with-body -H "Authorization: Bearer $GITHUB_TOKEN" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/${{ github.repository }}/deployments?environment=development&task=deploy:ODB&per_page=1" | jq -c '.[0].payload.docker_image_shas // empty')
          [ -n "$prev" ] || { echo "::error::no previous ODB deployment to carry forward"; exit 1; }
          sha=$(printf '%s' "$prev" | jq -r --arg p "web" '.[$p] // empty')
          [ -n "$sha" ] || { echo "::error::previous ODB deployment has no image for web"; exit 1; }
          echo "DOCKER_IMAGE_SHA_ODB_WEB=$sha" >> $GITHUB_ENV
          echo "ODB/web -> $sha (carried forward)"
          sha=$(printf '%s' "$prev" | jq -r --arg p "obscalc" '.[$p] // empty')
          [ -n "$sha" ] || { echo "::error::previous ODB deployment has no image for obscalc"; exit 1; }
          echo "DOCKER_IMAGE_SHA_ODB_OBSCALC=$sha" >> $GITHUB_ENV
          echo "ODB/obscalc -> $sha (carried forward)"
          sha=$(printf '%s' "$prev" | jq -r --arg p "calibration" '.[$p] // empty')
          [ -n "$sha" ] || { echo "::error::previous ODB deployment has no image for calibration"; exit 1; }
          echo "DOCKER_IMAGE_SHA_ODB_CALIBRATION=$sha" >> $GITHUB_ENV
          echo "ODB/calibration -> $sha (carried forward)"
          sha=$(printf '%s' "$prev" | jq -r --arg p "pdfsummary" '.[$p] // empty')
          [ -n "$sha" ] || { echo "::error::previous ODB deployment has no image for pdfsummary"; exit 1; }
          echo "DOCKER_IMAGE_SHA_ODB_PDFSUMMARY=$sha" >> $GITHUB_ENV
          echo "ODB/pdfsummary -> $sha (carried forward)"

      - name: Get RESOURCE Docker image SHA
        if: (contains(fromJSON(needs.affected.outputs.projects), 'resourceService'))
        run: |
          sha=$(docker inspect registry.heroku.com/${{ vars.HEROKU_RESOURCE_APP_NAME || 'lucuma-resource' }}-dev/web:${{ github.sha }} --format={{.Id}})
          [ -n "$sha" ] || { echo "::error::no docker image for RESOURCE/web"; exit 1; }
          echo "DOCKER_IMAGE_SHA_RESOURCE_WEB=$sha" >> $GITHUB_ENV
          echo "RESOURCE/web -> $sha"

      - name: Carry forward RESOURCE Docker image SHA
        if: '!(contains(fromJSON(needs.affected.outputs.projects), ''resourceService''))'
        run: |
          prev=$(curl -s --fail-with-body -H "Authorization: Bearer $GITHUB_TOKEN" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/${{ github.repository }}/deployments?environment=development&task=deploy:RESOURCE&per_page=1" | jq -c '.[0].payload.docker_image_shas // empty')
          [ -n "$prev" ] || { echo "::error::no previous RESOURCE deployment to carry forward"; exit 1; }
          sha=$(printf '%s' "$prev" | jq -r --arg p "web" '.[$p] // empty')
          [ -n "$sha" ] || { echo "::error::previous RESOURCE deployment has no image for web"; exit 1; }
          echo "DOCKER_IMAGE_SHA_RESOURCE_WEB=$sha" >> $GITHUB_ENV
          echo "RESOURCE/web -> $sha (carried forward)"

      - name: Record SSO deployment in GHA
        run: |
          echo "Recording deployment ${{ github.sha }} for SSO to ${{ github.repository }}"
          curl -s -X POST https://api.github.com/repos/${{ github.repository }}/deployments -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" -H "Accept: application/vnd.github+json" -d '{ "ref": "${{ github.sha }}", "environment": "development", "description": "SSO deployment to dev", "auto_merge": false, "required_contexts": [], "task": "deploy:SSO", "payload": { "docker_image_shas": { "web": "${{ env.DOCKER_IMAGE_SHA_SSO_WEB }}" } } }' 

      - name: Record ITC deployment in GHA
        run: |
          echo "Recording deployment ${{ github.sha }} for ITC to ${{ github.repository }}"
          curl -s -X POST https://api.github.com/repos/${{ github.repository }}/deployments -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" -H "Accept: application/vnd.github+json" -d '{ "ref": "${{ github.sha }}", "environment": "development", "description": "ITC deployment to dev", "auto_merge": false, "required_contexts": [], "task": "deploy:ITC", "payload": { "docker_image_shas": { "web": "${{ env.DOCKER_IMAGE_SHA_ITC_WEB }}" } } }' 

      - name: Record ODB deployment in GHA
        run: |
          echo "Recording deployment ${{ github.sha }} for ODB to ${{ github.repository }}"
          curl -s -X POST https://api.github.com/repos/${{ github.repository }}/deployments -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" -H "Accept: application/vnd.github+json" -d '{ "ref": "${{ github.sha }}", "environment": "development", "description": "ODB deployment to dev", "auto_merge": false, "required_contexts": [], "task": "deploy:ODB", "payload": { "docker_image_shas": { "web": "${{ env.DOCKER_IMAGE_SHA_ODB_WEB }}", "obscalc": "${{ env.DOCKER_IMAGE_SHA_ODB_OBSCALC }}", "calibration": "${{ env.DOCKER_IMAGE_SHA_ODB_CALIBRATION }}", "pdfsummary": "${{ env.DOCKER_IMAGE_SHA_ODB_PDFSUMMARY }}" } } }' 

      - name: Record RESOURCE deployment in GHA
        run: |
          echo "Recording deployment ${{ github.sha }} for RESOURCE to ${{ github.repository }}"
          curl -s -X POST https://api.github.com/repos/${{ github.repository }}/deployments -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" -H "Accept: application/vnd.github+json" -d '{ "ref": "${{ github.sha }}", "environment": "development", "description": "RESOURCE deployment to dev", "auto_merge": false, "required_contexts": [], "task": "deploy:RESOURCE", "payload": { "docker_image_shas": { "web": "${{ env.DOCKER_IMAGE_SHA_RESOURCE_WEB }}" } } }' 

  affected:
    name: Affected Projects
    strategy:
      matrix:
        os: [ubuntu-22.04]
        scala: [3]
        java: [temurin@25]
    runs-on: ${{ matrix.os }}
    outputs:
      all: ${{ steps.report.outputs.all }}
      projects: ${{ steps.report.outputs.projects }}
    timeout-minutes: 20
    steps:
      - name: Checkout current branch
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup sbt
        uses: sbt/setup-sbt@v1

      - name: Setup Java (temurin@25)
        id: setup-java-temurin-25
        if: matrix.java == 'temurin@25'
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 25
          cache: sbt

      - name: sbt update
        if: matrix.java == 'temurin@25' && steps.setup-java-temurin-25.outputs.cache-hit == 'false'
        run: sbt -v -J-Xmx6g -J-Xss4M +update

      - name: Compute affected projects
        id: report
        env:
          LUCUMA_AFFECTED_PUSH_BASE: ${{ github.event.before }}
        run: sbt -v -J-Xmx6g -J-Xss4M lucumaAffectedReport

  required-checks:
    name: REQUIRED CHECKS FOR BRANCH PROTECTION - AGGREGATED
    needs: [build]
    if: always()
    strategy:
      matrix:
        os: [ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Fail if a required job did not pass
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: |
          echo "::error::a required job did not pass"
          exit 1

      - name: Report success
        run: echo "all of build passed or were skipped"
